name: CI

on:
  pull_request:
  push:
    branches: main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: ".nvmrc"
      - run: pnpm install --frozen-lockfile
      - run: pnpm format-check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm coverage
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/index.js

  # Something for the integration job to await
  integration-target:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 30

  integration:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist # overwrite dist/index.js
      - uses: ./
        with:
          statuses: integration-target
